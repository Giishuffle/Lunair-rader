name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build FIRST. apps/web and apps/worker import @lunair/core and
      # @lunair/rules through their compiled dist output, so typecheck and the
      # vitest aliases both fail on a clean checkout until the packages exist.
      # npm runs workspaces in the order declared in the root package.json
      # (packages/* before apps/*), which is the order we need.
      - name: Build packages and apps
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
