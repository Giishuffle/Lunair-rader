<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Lunair World icon</title>
  <!-- backdrop -->
  <circle cx="128" cy="128" r="120" fill="#0B1B33"/>
  <!-- moon -->
  <circle cx="110" cy="142" r="62" fill="#F4F6FB"/>
  <!-- crescent cut -->
  <circle cx="138" cy="118" r="58" fill="#0B1B33"/>
  <!-- radar arcs (upper-right quadrant around ping) -->
  <circle cx="172" cy="84" r="18" fill="none" stroke="#F5A623" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="28.3 84.8" transform="rotate(-90 172 84)"/>
  <circle cx="172" cy="84" r="32" fill="none" stroke="#FFC461" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="50.3 150.8" transform="rotate(-90 172 84)"/>
  <!-- ping dot -->
  <circle cx="172" cy="84" r="9" fill="#F5A623"/>
</svg>
