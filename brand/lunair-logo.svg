    <circle cx="128" cy="128" r="120" fill="#0B1B33"/>
    <circle cx="110" cy="142" r="62" fill="#F4F6FB"/>
    <circle cx="138" cy="118" r="58" fill="#0B1B33"/>
    <circle cx="172" cy="84" r="18" fill="none" stroke="#F5A623" stroke-width="7" stroke-linecap="round"
